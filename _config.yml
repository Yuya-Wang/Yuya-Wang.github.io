# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.


# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # Currently available options are "default", "air"
title                    : "Yuya Wang/Personal Website"
title_separator          : "-"
name                     : &name "Yuya Wang"
description              : &description "Yuya Wang is a finance researcher at Brandeis University studying technological innovation, market structure, mergers and acquisitions, and asset valuation."   # Update this with a general description of your site, this is the default if not overridden by a page
url                      : "https://yuya-wang.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "Yuya-Wang/yuya-wang.github.io"


# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "headshot_web.jpg"
  name             : "Yuya Wang"
  pronouns         : "she/her"  
  bio              : ""
  location         : "Waltham - Massachusetts"
  employer         : "Brandeis University"
  uri              : # URL
  email            : "yuyawang@brandeis.edu" 


  # Academic websites
  academia         : # URL
  arxiv            : # URL - Update with the correct link to your profile
